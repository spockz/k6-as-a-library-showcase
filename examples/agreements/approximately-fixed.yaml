# This example models a nearly constant ten-operation-per-second workload by limiting every 100 ms window.
agreements:
  - consumer: fixed-load-client
    provider: example-api
    slo:
      - endpoint:
          host: localhost
          method: GET
          pathTemplate: /headers
        loadConstraints:
          - amount: 1
            per-time-unit: 100ms
          - amount: 600
            per-time-unit: minute
            permittedFailures:
              - category: transport
                amount: 5
              - category: http_5xx
                amount: 3
              - category: functional
                amount: 6
                statusCodes: ["400", "404", "409", "422"]
        responseTimes:
          - statusCode: 200
            mean: 100ms
            median: 90ms
            p99: 200ms
            p100: 250ms
          - statusCode: 5xx
            p100: 250ms
