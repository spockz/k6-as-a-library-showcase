# This canonical agreement exercises rolling load, response-time, and categorized failure requirements together.
agreements:
  - consumer: logical-service-name-of-the-consumer
    provider: logical-service-name-of-the-provider
    slo:
      - endpoint:
          host: api.example.com
          method: GET
          pathTemplate: /foo/bar/{id}
        loadConstraints:
          - amount: 400
            per-time-unit: ms
          - amount: 800
            per-time-unit: day
            permittedFailures:
              - category: transport
                amount: 5
              - category: http_5xx
                amount: 4
              - category: functional
                amount: 8
                statusCodes: ["400", "404", "409", "422"]
        responseTimes:
          - statusCode: 200
            mean: 100ms
            median: 110ms
            p99: 120ms
            p100: 150ms #or max
          - statusCode: 5xx
            p100: 50ms
